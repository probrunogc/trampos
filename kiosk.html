<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empório GO — Quiosque</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(ellipse at 55% -10%, #1e3a5f 0%, #0d1b2a 55%, #060e18 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      padding: 32px 24px;
      overflow: hidden;
    }

    /* ── Ambient decorative rings ── */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
    }
    body::before {
      width: 720px; height: 720px;
      top: -240px; right: -200px;
      border: 1px solid rgba(232,196,74,0.08);
      box-shadow: inset 0 0 120px rgba(232,196,74,0.03);
    }
    body::after {
      width: 520px; height: 520px;
      bottom: -180px; left: -160px;
      border: 1px solid rgba(232,196,74,0.05);
    }

    /* ── Clock bar ── */
    .clock-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: rgba(4, 12, 24, 0.82);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(232,196,74,0.14);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      z-index: 10;
    }
    .clock-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .clock-status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.2);
      animation: pulse-dot 2.6s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 3px rgba(34,197,94,0.2); }
      50%       { box-shadow: 0 0 0 6px rgba(34,197,94,0.08); }
    }
    .clock-store {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #e8c44a;
      text-transform: uppercase;
      opacity: 0.9;
    }
    .clock-time {
      font-size: 15px;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 44px;
      margin-top: 20px;
    }
    .logo-wrap {
      width: 92px; height: 92px;
      border-radius: 50%;
      margin: 0 auto 18px;
      background: radial-gradient(circle at 40% 35%, #1e3661, #0a1628);
      border: 2px solid rgba(232,196,74,0.38);
      box-shadow: 0 0 0 5px rgba(232,196,74,0.07), 0 0 0 9px rgba(232,196,74,0.03), 0 18px 44px rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .logo {
      width: 84px; height: 84px;
      border-radius: 50%;
      object-fit: cover;
    }
    .logo-fallback {
      font-size: 34px;
      font-weight: 900;
      color: #e8c44a;
      letter-spacing: -1px;
    }
    .brand {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 5px;
      color: #e8c44a;
      text-shadow: 0 2px 24px rgba(232,196,74,0.32);
    }
    .brand-sub {
      font-size: 11px;
      color: rgba(232,196,74,0.42);
      letter-spacing: 5px;
      margin-top: 5px;
    }
    .greeting {
      font-size: 17px;
      color: rgba(170,187,204,0.75);
      margin-top: 20px;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    /* ── Operator cards ── */
    .ops-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      max-width: 960px;
      width: 100%;
    }
    .op-card {
      background: linear-gradient(160deg, #192d47 0%, #0f1f36 100%);
      border: 1.5px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      width: 228px;
      padding: 38px 22px 30px;
      text-align: center;
      cursor: pointer;
      transition: transform .2s cubic-bezier(.34,1.56,.64,1),
                  border-color .18s ease,
                  box-shadow .18s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }
    /* Radial glow reveal on hover */
    .op-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: radial-gradient(ellipse at 50% 0%, rgba(232,196,74,0.14) 0%, transparent 65%);
      opacity: 0;
      transition: opacity .2s ease;
    }
    /* Shimmer sweep line on hover */
    .op-card::after {
      content: '';
      position: absolute;
      top: -40%; left: -60%;
      width: 40%; height: 180%;
      background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.06) 50%, transparent 70%);
      transform: skewX(-15deg);
      opacity: 0;
      transition: opacity .1s ease;
      pointer-events: none;
    }
    .op-card:hover {
      transform: translateY(-7px) scale(1.025);
      border-color: rgba(232,196,74,0.6);
      box-shadow: 0 22px 52px rgba(0,0,0,0.55), 0 0 0 1px rgba(232,196,74,0.22);
    }
    .op-card:hover::before { opacity: 1; }
    .op-card:hover::after {
      opacity: 1;
      animation: shimmer-sweep .55s ease forwards;
    }
    .op-card:active { transform: translateY(-2px) scale(0.97); }
    @keyframes shimmer-sweep {
      0%   { left: -60%; }
      100% { left: 120%; }
    }

    .op-avatar {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1e3a68, #0e2040);
      border: 2.5px solid #e8c44a;
      box-shadow: 0 0 0 5px rgba(232,196,74,0.14), 0 0 0 9px rgba(232,196,74,0.06), 0 10px 28px rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; font-weight: 900; color: #e8c44a;
      margin: 0 auto 20px;
      transition: box-shadow .2s ease;
    }
    .op-card:hover .op-avatar {
      box-shadow: 0 0 0 6px rgba(232,196,74,0.24), 0 0 0 11px rgba(232,196,74,0.09), 0 12px 32px rgba(0,0,0,0.5);
    }
    .op-name { font-size: 19px; font-weight: 800; color: #fff; letter-spacing: 0.2px; }
    .op-role {
      font-size: 11px;
      color: rgba(100,136,170,0.75);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }
    .op-tap-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 18px;
      font-size: 11px;
      color: rgba(232,196,74,0.52);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity .18s ease;
    }
    .op-tap-hint svg { width: 12px; height: 12px; }
    .op-card:hover .op-tap-hint { opacity: 1; }

    /* ── PIN overlay ── */
    .pin-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(3, 9, 19, 0.93);
      backdrop-filter: blur(14px) saturate(80%);
      -webkit-backdrop-filter: blur(14px) saturate(80%);
      align-items: center; justify-content: center;
      z-index: 200;
    }
    .pin-overlay.open { display: flex; animation: overlay-in .22s ease; }
    @keyframes overlay-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .pin-box {
      background: linear-gradient(170deg, #17273f 0%, #0f1e32 100%);
      border: 1px solid rgba(232,196,74,0.2);
      border-radius: 32px;
      padding: 44px 40px 36px;
      width: 440px;
      max-width: calc(100vw - 32px);
      text-align: center;
      box-shadow: 0 36px 90px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.04);
      position: relative;
      animation: box-slide-in .28s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes box-slide-in {
      from { transform: scale(0.88) translateY(20px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }
    /* Gold shimmer top line */
    .pin-box::before {
      content: '';
      position: absolute;
      top: 0; left: 12%; right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,196,74,0.55), transparent);
      border-radius: 32px 32px 0 0;
    }

    .pin-close-btn {
      position: absolute;
      top: 16px; right: 16px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(150,170,200,0.65);
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .15s, color .15s, transform .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .pin-close-btn:hover { background: rgba(255,255,255,0.1); color: #fff; transform: scale(1.1); }

    .pin-avatar-sm {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1e3a68, #0e2040);
      border: 2px solid rgba(232,196,74,0.55);
      box-shadow: 0 0 0 4px rgba(232,196,74,0.1);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 900; color: #e8c44a;
      margin: 0 auto 14px;
    }
    .pin-name { font-size: 22px; font-weight: 800; margin-bottom: 4px; color: #fff; }
    .pin-label {
      font-size: 12px;
      color: rgba(100,136,170,0.72);
      margin-bottom: 28px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* PIN dots */
    .pin-dots {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 32px;
    }
    .pin-dot {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(51,85,170,0.55);
      background: transparent;
      transition: background .12s cubic-bezier(.34,1.56,.64,1),
                  border-color .12s ease,
                  transform .14s cubic-bezier(.34,1.56,.64,1),
                  box-shadow .14s ease;
    }
    .pin-dot.filled {
      background: #e8c44a;
      border-color: #e8c44a;
      transform: scale(1.22);
      box-shadow: 0 0 10px rgba(232,196,74,0.55), 0 0 22px rgba(232,196,74,0.2);
    }

    /* PIN pad grid */
    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .pin-btn {
      height: 80px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 16px;
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background .1s ease,
                  border-color .1s ease,
                  transform .14s cubic-bezier(.34,1.56,.64,1),
                  box-shadow .1s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      position: relative;
      overflow: hidden;
    }
    .pin-btn .pin-sub {
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.28);
      text-transform: uppercase;
      line-height: 1;
    }
    .pin-btn:hover {
      background: rgba(232,196,74,0.12);
      border-color: rgba(232,196,74,0.42);
    }
    .pin-btn:active, .pin-btn.pressed {
      background: rgba(232,196,74,0.22);
      border-color: #e8c44a;
      transform: scale(0.91);
      box-shadow: 0 0 18px rgba(232,196,74,0.22);
    }

    /* Ripple on press */
    .pin-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: radial-gradient(circle at center, rgba(232,196,74,0.28), transparent 68%);
      opacity: 0;
      transition: opacity .4s ease;
    }
    .pin-btn.pressed::after { opacity: 1; }

    /* Del (backspace) key */
    .pin-btn.del {
      background: rgba(255,255,255,0.03);
      border-color: rgba(255,255,255,0.06);
      color: rgba(150,180,220,0.65);
      font-size: 20px;
    }
    .pin-btn.del:hover { color: #fff; background: rgba(255,100,100,0.1); border-color: rgba(255,100,100,0.32); }
    .pin-btn.del:active { background: rgba(255,100,100,0.18); }

    /* Cancel button */
    .pin-cancel-row { margin-top: 4px; }
    .pin-cancel-btn {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      color: rgba(100,136,170,0.65);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: color .15s, background .15s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .pin-cancel-btn:hover {
      color: rgba(180,200,220,0.85);
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.12);
    }

    .pin-err {
      color: #ff7070;
      font-size: 13px;
      min-height: 20px;
      margin-top: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      animation: shake 0s;
    }
    .pin-err.shaking { animation: shake .38s cubic-bezier(.36,.07,.19,.97); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-9px); }
      40%      { transform: translateX(9px); }
      60%      { transform: translateX(-5px); }
      80%      { transform: translateX(5px); }
    }

    /* ── Fallback email/pass form ── */
    #fallback { display: none; width: 100%; max-width: 340px; }
    .field { margin-bottom: 14px; text-align: left; }
    .field label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: rgba(100,136,170,0.8); letter-spacing: .8px; margin-bottom: 7px; }
    .field input { width: 100%; background: rgba(13,27,42,0.9); border: 1px solid rgba(255,255,255,0.09); border-radius: 10px; padding: 13px 15px; color: #fff; font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s; }
    .field input:focus { border-color: #e8c44a; box-shadow: 0 0 0 3px rgba(232,196,74,0.14); }
    .save-row { display: flex; align-items: center; gap: 10px; margin: 14px 0 18px; cursor: pointer; }
    .save-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: #e8c44a; }
    .save-row span { font-size: 13px; color: rgba(136,153,187,0.8); }
    .btn { width: 100%; padding: 15px; background: #e8c44a; color: #0d1b2a; border: none; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; transition: background .15s, transform .1s; letter-spacing: 1px; text-transform: uppercase; }
    .btn:hover:not(:disabled) { background: #f5d45a; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: .55; cursor: default; }
    .err-msg { color: #ff7070; font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }

    /* ── Loading ── */
    .loading { color: rgba(136,153,170,0.8); font-size: 14px; display: flex; align-items: center; gap: 12px; }
    .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.1); border-top-color: #e8c44a; border-radius: 50%; animation: spin .75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Top clock bar -->
  <div class="clock-bar">
    <div class="clock-left">
      <span class="clock-status-dot"></span>
      <span class="clock-store">Empório GO</span>
    </div>
    <span class="clock-time" id="clock">--:--</span>
  </div>

  <div class="header">
    <div class="logo-wrap">
      <img class="logo" src="./assets/logo.png" alt=""
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
      <span class="logo-fallback" style="display:none">G</span>
    </div>
    <div class="brand">EMPÓRIO GO</div>
    <div class="brand-sub">★ TERMINAL DE CAIXA ★</div>
    <div class="greeting" id="greeting">Quem está trabalhando hoje?</div>
  </div>

  <div id="status" class="loading">
    <div class="spinner"></div>
    <span>Carregando operadores…</span>
  </div>

  <!-- Operator selection grid -->
  <div class="ops-grid" id="ops-grid"></div>

  <!-- Fallback: email + password for admins -->
  <div id="fallback">
    <div class="field">
      <label for="f-email">E-mail</label>
      <input id="f-email" type="email" placeholder="seu@email.com" autocomplete="username">
    </div>
    <div class="field">
      <label for="f-pass">Senha</label>
      <input id="f-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <label class="save-row">
      <input id="f-save" type="checkbox" checked>
      <span>Lembrar neste quiosque</span>
    </label>
    <button class="btn" id="f-btn">Entrar</button>
    <div class="err-msg" id="f-err"></div>
  </div>

  <!-- PIN pad overlay -->
  <div class="pin-overlay" id="pin-overlay">
    <div class="pin-box">
      <button class="pin-close-btn" id="pin-cancel-x" aria-label="Cancelar">✕</button>

      <div class="pin-avatar-sm" id="pin-avatar-sm">?</div>
      <div class="pin-name" id="pin-who"></div>
      <div class="pin-label">Digite seu PIN de 6 dígitos</div>

      <div class="pin-dots" id="pin-dots">
        <div class="pin-dot" data-i="0"></div>
        <div class="pin-dot" data-i="1"></div>
        <div class="pin-dot" data-i="2"></div>
        <div class="pin-dot" data-i="3"></div>
        <div class="pin-dot" data-i="4"></div>
        <div class="pin-dot" data-i="5"></div>
      </div>

      <div class="pin-pad">
        <button class="pin-btn" data-d="1">1<span class="pin-sub"></span></button>
        <button class="pin-btn" data-d="2">2<span class="pin-sub">ABC</span></button>
        <button class="pin-btn" data-d="3">3<span class="pin-sub">DEF</span></button>
        <button class="pin-btn" data-d="4">4<span class="pin-sub">GHI</span></button>
        <button class="pin-btn" data-d="5">5<span class="pin-sub">JKL</span></button>
        <button class="pin-btn" data-d="6">6<span class="pin-sub">MNO</span></button>
        <button class="pin-btn" data-d="7">7<span class="pin-sub">PQRS</span></button>
        <button class="pin-btn" data-d="8">8<span class="pin-sub">TUV</span></button>
        <button class="pin-btn" data-d="9">9<span class="pin-sub">WXYZ</span></button>
        <button class="pin-btn del" id="pin-del" aria-label="Apagar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
            <line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/>
          </svg>
        </button>
        <button class="pin-btn" data-d="0">0<span class="pin-sub">+</span></button>
        <span></span>
      </div>

      <div class="pin-cancel-row">
        <button class="pin-cancel-btn" id="pin-cancel-btn">Cancelar</button>
      </div>

      <div class="pin-err" id="pin-err"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp }
      from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged }
      from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
    import { getFirestore, collection, query, where, getDocs }
      from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';
    import { firebaseConfig }
      from './scripts/firebase-config.js';

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);
    const SAVED_KEY = '_kk';

    const goSales = () => { localStorage.setItem('_km', '1'); location.href = './index.html#/sales'; };

    /* ── Clock ── */
    (function tick() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const el = document.getElementById('clock');
      if (el) el.textContent = h + ':' + m;
      setTimeout(tick, 10000);
    })();

    /* ── Load operators from Firestore settings ── */
    async function loadOperators() {
      try {
        const snap = await getDocs(query(collection(db, 'settings'), where('_type', '==', 'kiosk_op')));
        return snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .filter(o => o.active !== false)
          .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      } catch { return []; }
    }

    /* ── Auth check on load ── */
    onAuthStateChanged(auth, async user => {
      if (user) { goSales(); return; }

      const raw = localStorage.getItem(SAVED_KEY);
      if (raw) {
        try {
          const { e, p } = JSON.parse(atob(raw));
          await signInWithEmailAndPassword(auth, e, p);
          return;
        } catch { localStorage.removeItem(SAVED_KEY); }
      }

      const ops = await loadOperators();
      document.getElementById('status').style.display = 'none';

      if (ops.length > 0) {
        renderOperators(ops);
      } else {
        document.getElementById('greeting').textContent = 'Faça login para continuar';
        document.getElementById('fallback').style.display = 'block';
        document.getElementById('f-email').focus();
      }
    });

    /* ── Render operator name cards ── */
    function renderOperators(ops) {
      const grid = document.getElementById('ops-grid');
      grid.innerHTML = ops.map(op => `
        <div class="op-card" data-id="${op.id}" data-email="${op.email}" data-initial="${(op.name || '?').charAt(0).toUpperCase()}">
          <div class="op-avatar">${(op.name || '?').charAt(0).toUpperCase()}</div>
          <div class="op-name">${op.name}</div>
          <div class="op-role">${op.role || 'Operador'}</div>
          <div class="op-tap-hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/>
            </svg>
            Toque para entrar
          </div>
        </div>
      `).join('');

      grid.querySelectorAll('.op-card').forEach(card => {
        card.onclick = () => openPin(card.dataset.email, card.querySelector('.op-name').textContent, card.dataset.initial);
      });
    }

    /* ── PIN pad logic ── */
    let pinEmail = '', pinBuffer = '';

    function openPin(email, name, initial) {
      pinEmail = email;
      pinBuffer = '';
      updateDots();
      document.getElementById('pin-who').textContent = name;
      document.getElementById('pin-avatar-sm').textContent = initial || name.charAt(0).toUpperCase();
      document.getElementById('pin-err').textContent = '';
      document.getElementById('pin-err').classList.remove('shaking');
      document.getElementById('pin-overlay').classList.add('open');
    }

    function updateDots() {
      document.querySelectorAll('.pin-dot').forEach((d, i) => {
        d.classList.toggle('filled', i < pinBuffer.length);
      });
    }

    async function submitPin() {
      const err = document.getElementById('pin-err');
      err.textContent = '';
      try {
        await signInWithEmailAndPassword(auth, pinEmail, pinBuffer);
        localStorage.setItem(SAVED_KEY, btoa(JSON.stringify({ e: pinEmail, p: pinBuffer })));
      } catch {
        err.textContent = 'PIN incorreto. Tente novamente.';
        err.classList.remove('shaking');
        void err.offsetWidth;
        err.classList.add('shaking');
        pinBuffer = '';
        updateDots();
      }
    }

    /* ── Digit press feedback ── */
    function flashBtn(btn) {
      btn.classList.add('pressed');
      setTimeout(() => btn.classList.remove('pressed'), 200);
    }

    document.querySelectorAll('.pin-btn[data-d]').forEach(btn => {
      btn.onclick = async () => {
        if (pinBuffer.length >= 6) return;
        flashBtn(btn);
        pinBuffer += btn.dataset.d;
        updateDots();
        if (pinBuffer.length === 6) await submitPin();
      };
    });

    document.getElementById('pin-del').onclick = () => {
      flashBtn(document.getElementById('pin-del'));
      pinBuffer = pinBuffer.slice(0, -1);
      updateDots();
      document.getElementById('pin-err').textContent = '';
    };

    const closePin = () => {
      document.getElementById('pin-overlay').classList.remove('open');
      pinBuffer = '';
    };
    document.getElementById('pin-cancel-x').onclick = closePin;
    document.getElementById('pin-cancel-btn').onclick = closePin;
    document.getElementById('pin-overlay').onclick = e => {
      if (e.target === document.getElementById('pin-overlay')) closePin();
    };

    /* ── Keyboard support ── */
    document.addEventListener('keydown', async e => {
      const overlay = document.getElementById('pin-overlay');
      if (!overlay.classList.contains('open')) return;

      if (e.key >= '0' && e.key <= '9') {
        if (pinBuffer.length >= 6) return;
        const btn = document.querySelector(`.pin-btn[data-d="${e.key}"]`);
        if (btn) flashBtn(btn);
        pinBuffer += e.key;
        updateDots();
        if (pinBuffer.length === 6) await submitPin();
      } else if (e.key === 'Backspace') {
        const delBtn = document.getElementById('pin-del');
        flashBtn(delBtn);
        pinBuffer = pinBuffer.slice(0, -1);
        updateDots();
        document.getElementById('pin-err').textContent = '';
      } else if (e.key === 'Escape') {
        closePin();
      }
    });

    /* ── Fallback email/password login ── */
    async function doFallbackLogin() {
      const email = document.getElementById('f-email').value.trim();
      const pass  = document.getElementById('f-pass').value;
      const save  = document.getElementById('f-save').checked;
      const btn   = document.getElementById('f-btn');
      const err   = document.getElementById('f-err');
      if (!email || !pass) { err.textContent = 'Preencha e-mail e senha.'; return; }
      btn.disabled = true; btn.textContent = 'Entrando…'; err.textContent = '';
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        if (save) localStorage.setItem(SAVED_KEY, btoa(JSON.stringify({ e: email, p: pass })));
      } catch {
        err.textContent = 'E-mail ou senha incorretos.';
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    }

    document.getElementById('f-btn').onclick = doFallbackLogin;
    document.getElementById('f-pass').onkeydown = e => { if (e.key === 'Enter') doFallbackLogin(); };
  </script>
</body>
</html>
