<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A1628" />
  <title>Empório das Bebidas — Financeiro</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Financeiro" />
  <link rel="apple-touch-icon" href="assets/logo.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/modules.css" />
  <link rel="stylesheet" href="styles/print.css" media="print" />

  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
</head>
<body>
  <!-- Boot splash -->
  <div id="boot-splash" class="boot-splash">
    <div class="boot-medallion">
      <img src="assets/logo.svg" alt="Empório das Bebidas" />
    </div>
    <div class="boot-progress"><div class="boot-progress-bar"></div></div>
    <p class="boot-hint">Carregando painel…</p>
  </div>

  <!-- PIN -->
  <section id="screen-pin" class="screen-login hidden">
    <div class="login-bg-grain"></div>
    <div class="login-card">
      <div class="login-medallion">
        <img src="assets/logo.svg" alt="Empório das Bebidas" />
      </div>
      <h1 class="login-title">PAINEL</h1>
      <p class="login-sub">financeiro</p>
      <p class="login-since">★ EMPÓRIO DAS BEBIDAS ★</p>

      <p class="op-prompt">Digite o PIN de acesso</p>
      <div class="pin-dots" id="pin-dots"></div>
      <div id="pin-error" class="login-error" role="alert"></div>
      <div class="pin-pad" id="pin-pad"></div>
    </div>
  </section>

  <!-- Painel financeiro -->
  <div id="fin-app" class="fin-app hidden">
    <header class="fin-header">
      <div class="fin-header-brand">
        <img src="assets/logo.svg" alt="" />
        <div>
          <h1 id="fin-title">Resumo</h1>
          <span class="fin-header-sub">Empório das Bebidas</span>
        </div>
      </div>
      <div class="fin-date" id="fin-date"></div>
    </header>

    <main class="fin-content" id="fin-content"></main>

    <nav class="fin-nav" id="fin-nav"></nav>
  </div>

  <!-- Modal host -->
  <div id="modal-host" class="modal-host hidden" aria-hidden="true">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-window" role="dialog" aria-modal="true">
      <header class="modal-header">
        <h3 id="modal-title">Título</h3>
        <button class="btn-icon-ghost" data-modal-close title="Fechar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-footer" id="modal-footer"></footer>
    </div>
  </div>

  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <div id="print-host" class="print-host"></div>

  <script type="module" src="scripts/financeiro.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('gesturestart', e => e.preventDefault());
  </script>
</body>
</html>
