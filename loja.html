<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1A0A4A" />
  <title>Empório GO — Delivery</title>
  <style>
    *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;outline:none!important}
    input,textarea{-webkit-user-select:text!important;user-select:text!important}
  </style>

  <!-- PWA -->
  <link rel="manifest" href="loja-manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Empório GO" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/logo.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="icon" type="image/png" href="assets/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles/glass.css" />
  <link rel="stylesheet" href="styles/loja.css" />
</head>
<body>
  <!-- SVG filter definitions for liquid glass effects -->
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <filter id="lg-liquid" x="-12%" y="-12%" width="124%" height="124%">
        <feTurbulence type="fractalNoise" baseFrequency="0.011 0.007" numOctaves="4" seed="3" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="lg-grain" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="9" result="noise"/>
        <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
        <feBlend in="SourceGraphic" in2="gray" mode="screen" result="blended"/>
        <feComposite in="blended" in2="SourceGraphic" operator="in"/>
      </filter>
    </defs>
  </svg>
  <!-- Splash -->
  <div id="splash" class="loja-splash">
    <img src="assets/logo.png" alt="Empório GO" />
    <p>Carregando…</p>
  </div>

  <!-- App shell -->
  <div id="app" class="loja-app hidden">
    <div id="view-root" class="view-root"></div>
    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>

  <script async src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module" src="scripts/loja.js"></script>
  <!-- DEV: régua de alinhamento — remover antes do lançamento -->
  <!-- <script src="scripts/dev-ruler.js"></script> -->
  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault());
    document.addEventListener('selectstart', e => { if (!e.target.matches('input,textarea')) e.preventDefault(); }, true);
    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('copy', e => { if (!e.target.matches('input,textarea')) e.preventDefault(); });
    document.addEventListener('cut',  e => { if (!e.target.matches('input,textarea')) e.preventDefault(); });
    document.addEventListener('keydown', e => {
      const ctrl = e.ctrlKey || e.metaKey;
      // Bloqueia: Ctrl+U (fonte), Ctrl+S (salvar), Ctrl+A (selecionar tudo),
      //           Ctrl+C (copiar), Ctrl+P (imprimir), F12, Ctrl+Shift+I/J (DevTools)
      if (ctrl && ['u','s','a','c','p'].includes(e.key.toLowerCase())) e.preventDefault();
      if (e.key === 'F12') e.preventDefault();
      if (ctrl && e.shiftKey && ['i','j','c'].includes(e.key.toLowerCase())) e.preventDefault();
    });
    if ('serviceWorker' in navigator) {
      let _reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!_reloading) { _reloading = true; window.location.reload(); }
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./loja-sw.js', { updateViaCache: 'none' })
          .then(reg => {
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update().catch(() => {});
            });
          })
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
