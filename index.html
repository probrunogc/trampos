<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A1628" id="meta-theme-color" />
  <title>Empório GO — Sistema de Gestão</title>

  <!-- PWA / modo aplicativo -->
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Empório GO" />
  <meta name="application-name" content="Empório GO" />
  <link rel="apple-touch-icon" href="assets/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/glass.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/modules.css" />
  <link rel="stylesheet" href="styles/print.css" media="print" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <link rel="icon" type="image/png" href="assets/logo.png" />
  <script>
    /* Aplica o tema antes do render para evitar flash */
    (function () {
      var t = localStorage.getItem('emporio:theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <!-- SVG filter definitions for liquid glass effects -->
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <!-- Liquid displacement: subtle warp on decorative layers -->
      <filter id="lg-liquid" x="-12%" y="-12%" width="124%" height="124%">
        <feTurbulence type="fractalNoise" baseFrequency="0.011 0.007" numOctaves="4" seed="3" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- Frosted grain: extra micro-texture on glass surfaces -->
      <filter id="lg-grain" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="9" result="noise"/>
        <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
        <feBlend in="SourceGraphic" in2="gray" mode="screen" result="blended"/>
        <feComposite in="blended" in2="SourceGraphic" operator="in"/>
      </filter>
    </defs>
  </svg>
  <!-- Boot splash -->
  <div id="boot-splash" class="boot-splash">
    <div class="boot-medallion">
      <img src="assets/logo.png" alt="Empório GO" />
    </div>
    <div class="boot-progress"><div class="boot-progress-bar"></div></div>
    <p class="boot-hint">Inicializando sistema…</p>
  </div>

  <!-- Login screen -->
  <section id="screen-login" class="screen-login hidden">
    <div class="login-bg-grain"></div>
    <div class="login-card">
      <div class="login-medallion">
        <img src="assets/logo.png" alt="Empório GO" />
      </div>
      <h1 class="login-title">EMPÓRIO</h1>
      <p class="login-sub">GO</p>
      <p class="login-since">★ SINCE 2025 ★</p>

      <form id="form-login" class="login-form" autocomplete="off" novalidate>
        <label class="field">
          <span class="field-label">E-mail</span>
          <input type="email" id="login-email" required autocomplete="username" placeholder="seu@email.com" />
        </label>
        <label class="field">
          <span class="field-label">Senha</span>
          <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••" />
        </label>
        <div id="login-error" class="login-error" role="alert"></div>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit">
          <span>Entrar</span>
        </button>
        <p class="login-hint">
          <a href="#" id="link-bootstrap">Primeiro acesso? Configurar administrador →</a>
        </p>
      </form>
    </div>
  </section>

  <!-- Bootstrap screen — criar primeiro admin -->
  <section id="screen-bootstrap" class="screen-login hidden">
    <div class="login-bg-grain"></div>
    <div class="login-card">
      <div class="login-medallion">
        <img src="assets/logo.png" alt="Empório GO" />
      </div>
      <h1 class="login-title">SETUP</h1>
      <p class="login-sub">primeiro acesso</p>
      <p class="login-since">★ CRIE O ADMIN ★</p>

      <form id="form-bootstrap" class="login-form" autocomplete="off" novalidate>
        <label class="field">
          <span class="field-label">Seu nome</span>
          <input type="text" id="bs-name" required placeholder="Ex.: Bruno" />
        </label>
        <label class="field">
          <span class="field-label">E-mail</span>
          <input type="email" id="bs-email" required placeholder="seu@email.com" />
        </label>
        <label class="field">
          <span class="field-label">Senha</span>
          <input type="password" id="bs-password" required minlength="6" placeholder="mínimo 6 caracteres" />
        </label>
        <label class="field">
          <span class="field-label">Confirmar senha</span>
          <input type="password" id="bs-password2" required minlength="6" placeholder="repita a senha" />
        </label>
        <div id="bootstrap-error" class="login-error" role="alert"></div>
        <button type="submit" class="btn btn-primary btn-block" id="bs-submit">
          <span>Criar administrador</span>
        </button>
        <p class="login-hint">
          <a href="#" id="link-back-login">← Voltar para login</a>
        </p>
      </form>
    </div>
  </section>

  <!-- Main app shell -->
  <div id="app-shell" class="app-shell hidden">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-medallion sidebar-medallion-lg">
          <img src="assets/logo.png" alt="Empório GO" />
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Items injected by app.js based on user role -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip" id="user-chip">
          <div class="user-chip-avatar" id="user-avatar">?</div>
          <div class="user-chip-info">
            <span class="user-chip-name" id="user-name">—</span>
            <span class="user-chip-role" id="user-role">—</span>
          </div>
        </div>
        <button class="btn-icon-ghost" id="btn-logout" title="Sair">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </aside>

    <main class="main">

      <!-- Kiosk navigation bar — visible only when _km flag is set -->
      <nav class="kiosk-nav" id="kiosk-nav">
        <div class="kiosk-brand">
          <img src="assets/logo.png" class="kiosk-logo" alt="">
          <span class="kiosk-brand-name">EMPÓRIO GO</span>
        </div>
        <div class="kiosk-tabs" id="kiosk-tabs">
          <button class="kiosk-tab" data-mod="sales">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <span>Caixa</span>
          </button>
          <button class="kiosk-tab" data-mod="customers">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>Clientes</span>
          </button>
          <button class="kiosk-tab" data-mod="products">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/>
              <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            <span>Produtos</span>
          </button>
          <button class="kiosk-tab" data-mod="deliveries">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="3" width="15" height="13" rx="1"/>
              <path d="M16 8h4l3 5v3h-7V8z"/>
              <circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
            </svg>
            <span>Entregas</span>
          </button>
          <button class="kiosk-tab" data-mod="reports">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"/>
              <line x1="12" y1="20" x2="12" y2="4"/>
              <line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
            <span>Histórico</span>
          </button>
        </div>
        <div class="kiosk-actions">
          <time class="kiosk-clock" id="kiosk-clock"></time>
          <!-- Window controls -->
          <button class="kiosk-wc-btn" id="kiosk-minimize" title="Bloquear tela">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
          <button class="kiosk-wc-btn" id="kiosk-fullscreen-exit" title="Sair do fullscreen">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
              <path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
          </button>
          <button class="kiosk-logout-btn" id="kiosk-logout" title="Sair do quiosque">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </nav>

      <!-- Lock overlay — ativado pelo botão de minimizar no kiosk -->
      <div id="kiosk-lock" class="kiosk-lock hidden" aria-hidden="true">
        <div class="kiosk-lock-inner">
          <img src="assets/logo.png" class="kiosk-lock-logo" alt="">
          <div class="kiosk-lock-name">EMPÓRIO DAS BEBIDAS</div>
          <div class="kiosk-lock-hint">Toque para desbloquear</div>
        </div>
      </div>

      <header class="topbar">
        <div class="topbar-left">
          <button class="btn-icon-ghost sidebar-toggle" id="btn-sidebar-toggle" title="Menu">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <div class="topbar-title">
            <h2 id="page-title">Dashboard</h2>
            <p id="page-subtitle" class="topbar-sub">Visão geral do empório</p>
          </div>
        </div>
        <div class="topbar-right">
          <button class="btn-icon-ghost" id="btn-theme" title="Alternar tema claro/escuro" aria-label="Alternar tema"></button>
          <div class="topbar-date" id="topbar-date"></div>
        </div>
      </header>

      <section id="page-content" class="page-content">
        <!-- Modules render here -->
      </section>
    </main>
  </div>

  <!-- Modal host -->
  <div id="modal-host" class="modal-host hidden" aria-hidden="true">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-window" role="dialog" aria-modal="true">
      <header class="modal-header">
        <h3 id="modal-title">Título</h3>
        <button class="btn-icon-ghost" data-modal-close title="Fechar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-footer" id="modal-footer"></footer>
    </div>
  </div>

  <!-- Toast host -->
  <div id="toast-host" class="toast-host" aria-live="polite"></div>

  <!-- Print host (escondido em tela, visível em impressão) -->
  <div id="print-host" class="print-host"></div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script type="module" src="scripts/app.js"></script>

  <!-- PWA: registra service worker + comportamento de aplicativo -->
  <script>
    /* ── Notificação de atualização ────────────────────────────── */
    function showUpdateBanner() {
      if (document.getElementById('update-banner')) return;
      const b = document.createElement('div');
      b.id = 'update-banner';
      b.className = 'update-banner';
      b.innerHTML =
        '<span class="update-banner-icon">' +
          '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
            '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>' +
            '<path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>' +
          '</svg>' +
        '</span>' +
        '<span class="update-banner-text">Nova versão disponível</span>' +
        '<button class="update-banner-btn" onclick="window.location.reload()">Atualizar agora</button>' +
        '<button class="update-banner-close" onclick="this.parentElement.remove()" title="Dispensar">✕</button>';
      document.body.appendChild(b);
      requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add('update-banner-show')));
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(() => {
          /* 1. SW novo assumiu controle → recarregar */
          navigator.serviceWorker.addEventListener('controllerchange', showUpdateBanner);

          /* 2. Polling version.json a cada 5 min */
          let _lastVer = null;
          async function checkVersion() {
            try {
              const res = await fetch('version.json?_=' + Date.now(), { cache: 'no-store' });
              if (!res.ok) return;
              const data = await res.json();
              if (_lastVer === null) { _lastVer = data.v; return; }
              if (data.v !== _lastVer) { _lastVer = data.v; showUpdateBanner(); }
            } catch (_) {}
          }
          checkVersion();
          setInterval(checkVersion, 5 * 60 * 1000);
        }).catch(() => {});
      });
    }

    /* Bloqueia menu de contexto e zoom por gesto — cara de programa */
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault());
  </script>
</body>
</html>
