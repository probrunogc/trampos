<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A1628" id="meta-theme-color" />
  <title>Empório GO — Sistema de Gestão</title>

  <!-- PWA / modo aplicativo -->
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Empório GO" />
  <meta name="application-name" content="Empório GO" />
  <link rel="apple-touch-icon" href="assets/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/modules.css" />
  <link rel="stylesheet" href="styles/print.css" media="print" />

  <link rel="icon" type="image/png" href="assets/logo.png" />
  <script>
    /* Aplica o tema antes do render para evitar flash */
    (function () {
      var t = localStorage.getItem('emporio:theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <!-- Boot splash -->
  <div id="boot-splash" class="boot-splash">
    <div class="boot-medallion">
      <img src="assets/logo.png" alt="Empório GO" />
    </div>
    <div class="boot-progress"><div class="boot-progress-bar"></div></div>
    <p class="boot-hint">Inicializando sistema…</p>
  </div>

  <!-- Login screen -->
  <section id="screen-login" class="screen-login hidden">
    <div class="login-bg-grain"></div>
    <div class="login-card">
      <div class="login-medallion">
        <img src="assets/logo.png" alt="Empório GO" />
      </div>
      <h1 class="login-title">EMPÓRIO</h1>
      <p class="login-sub">GO</p>
      <p class="login-since">★ SINCE 2025 ★</p>

      <form id="form-login" class="login-form" autocomplete="off" novalidate>
        <label class="field">
          <span class="field-label">E-mail</span>
          <input type="email" id="login-email" required autocomplete="username" placeholder="seu@email.com" />
        </label>
        <label class="field">
          <span class="field-label">Senha</span>
          <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••" />
        </label>
        <div id="login-error" class="login-error" role="alert"></div>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit">
          <span>Entrar</span>
        </button>
        <p class="login-hint">
          <a href="#" id="link-bootstrap">Primeiro acesso? Configurar administrador →</a>
        </p>
      </form>
    </div>
  </section>

  <!-- Bootstrap screen — criar primeiro admin -->
  <section id="screen-bootstrap" class="screen-login hidden">
    <div class="login-bg-grain"></div>
    <div class="login-card">
      <div class="login-medallion">
        <img src="assets/logo.png" alt="Empório GO" />
      </div>
      <h1 class="login-title">SETUP</h1>
      <p class="login-sub">primeiro acesso</p>
      <p class="login-since">★ CRIE O ADMIN ★</p>

      <form id="form-bootstrap" class="login-form" autocomplete="off" novalidate>
        <label class="field">
          <span class="field-label">Seu nome</span>
          <input type="text" id="bs-name" required placeholder="Ex.: Bruno" />
        </label>
        <label class="field">
          <span class="field-label">E-mail</span>
          <input type="email" id="bs-email" required placeholder="seu@email.com" />
        </label>
        <label class="field">
          <span class="field-label">Senha</span>
          <input type="password" id="bs-password" required minlength="6" placeholder="mínimo 6 caracteres" />
        </label>
        <label class="field">
          <span class="field-label">Confirmar senha</span>
          <input type="password" id="bs-password2" required minlength="6" placeholder="repita a senha" />
        </label>
        <div id="bootstrap-error" class="login-error" role="alert"></div>
        <button type="submit" class="btn btn-primary btn-block" id="bs-submit">
          <span>Criar administrador</span>
        </button>
        <p class="login-hint">
          <a href="#" id="link-back-login">← Voltar para login</a>
        </p>
      </form>
    </div>
  </section>

  <!-- Main app shell -->
  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-medallion">
          <img src="assets/logo.png" alt="" />
        </div>
        <div class="sidebar-brand-text">
          <span class="sidebar-brand-name">EMPÓRIO</span>
          <span class="sidebar-brand-sub">GO</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Items injected by app.js based on user role -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip" id="user-chip">
          <div class="user-chip-avatar" id="user-avatar">?</div>
          <div class="user-chip-info">
            <span class="user-chip-name" id="user-name">—</span>
            <span class="user-chip-role" id="user-role">—</span>
          </div>
        </div>
        <button class="btn-icon-ghost" id="btn-logout" title="Sair">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn-icon-ghost sidebar-toggle" id="btn-sidebar-toggle" title="Menu">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <div class="topbar-title">
            <h2 id="page-title">Dashboard</h2>
            <p id="page-subtitle" class="topbar-sub">Visão geral do empório</p>
          </div>
        </div>
        <div class="topbar-right">
          <button class="btn-icon-ghost" id="btn-theme" title="Alternar tema claro/escuro" aria-label="Alternar tema"></button>
          <div class="topbar-date" id="topbar-date"></div>
        </div>
      </header>

      <section id="page-content" class="page-content">
        <!-- Modules render here -->
      </section>
    </main>
  </div>

  <!-- Modal host -->
  <div id="modal-host" class="modal-host hidden" aria-hidden="true">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-window" role="dialog" aria-modal="true">
      <header class="modal-header">
        <h3 id="modal-title">Título</h3>
        <button class="btn-icon-ghost" data-modal-close title="Fechar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-footer" id="modal-footer"></footer>
    </div>
  </div>

  <!-- Toast host -->
  <div id="toast-host" class="toast-host" aria-live="polite"></div>

  <!-- Print host (escondido em tela, visível em impressão) -->
  <div id="print-host" class="print-host"></div>

  <script type="module" src="scripts/app.js"></script>

  <!-- PWA: registra service worker + comportamento de aplicativo -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
    // Bloqueia menu de contexto e zoom por gesto — cara de programa
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault());
  </script>
</body>
</html>
