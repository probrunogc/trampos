<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lista de Produtos — Empório GO</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: monospace; background: #111; color: #eee; padding: 24px; max-width: 860px; margin: auto; }
  h1  { color: #d4af37; margin-bottom: 4px; }
  .subtitle { color: #888; margin-bottom: 24px; font-size: .85rem; }
  .summary { background: #1e1e1e; border-radius: 8px; padding: 14px 18px; margin-bottom: 24px;
             display: flex; gap: 32px; flex-wrap: wrap; }
  .summary b { color: #d4af37; font-size: 1.4rem; display: block; }
  .summary span { font-size: .8rem; color: #aaa; }
  h2  { color: #d4af37; font-size: .95rem; margin: 28px 0 8px; text-transform: uppercase; letter-spacing: 1px; }
  table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  th  { text-align: left; padding: 6px 10px; background: #222; color: #888; font-weight: 600; }
  td  { padding: 6px 10px; border-bottom: 1px solid #2a2a2a; vertical-align: top; }
  tr:hover td { background: #1c1c1c; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: .72rem;
         background: #2a2a2a; color: #aaa; }
  .tag.inativo { background: #3a1a1a; color: #e74c3c; }
  .tag.cat { background: #1a2a3a; color: #7cc5ee; }
  #status { color: #7cc5ee; padding: 20px 0; }
  #error  { color: #e74c3c; padding: 20px 0; }
  button  { background: #d4af37; color: #111; border: none; border-radius: 6px; padding: 8px 18px;
            cursor: pointer; font-weight: 700; margin-bottom: 16px; }
</style>
</head>
<body>
<h1>Produtos — Empório GO</h1>
<div class="subtitle">Auditoria ao vivo do Firestore</div>

<div id="status">⏳ Conectando ao Firestore…</div>
<div id="error" style="display:none"></div>
<div id="output" style="display:none">
  <div class="summary">
    <div><b id="s-total">-</b><span>Total</span></div>
    <div><b id="s-com">-</b><span>Com código de barras</span></div>
    <div><b id="s-sem">-</b><span>Sem código de barras</span></div>
    <div><b id="s-inat">-</b><span>Inativos</span></div>
  </div>

  <button onclick="window.print()">🖨 Imprimir / Salvar PDF</button>

  <h2>✅ Com código de barras</h2>
  <table id="t-com">
    <thead><tr><th>Produto</th><th>Marca</th><th>Categoria</th><th>Código</th><th>Preço</th><th>Estoque</th><th>Status</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>❌ Sem código de barras</h2>
  <table id="t-sem">
    <thead><tr><th>Produto</th><th>Marca</th><th>Categoria</th><th>ID Firestore</th><th>Preço</th><th>Estoque</th><th>Status</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script type="module">
import { initializeApp }        from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
import { getFirestore, collection, getDocs, orderBy, query }
                                from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';

const cfg = {
  apiKey:            'AIzaSyCT3BGvNWRzoOc3mT4lDRRfz6GISptkUzc',
  authDomain:        'adegas-pf.firebaseapp.com',
  projectId:         'adegas-pf',
  storageBucket:     'adegas-pf.firebasestorage.app',
  messagingSenderId: '688042256969',
  appId:             '1:688042256969:web:110f697c3db4ee7b57ed98',
};

const esc = s => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const brl = v => (v ?? 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });

try {
  const app  = initializeApp(cfg);
  const db   = getFirestore(app);
  const snap = await getDocs(query(collection(db, 'products'), orderBy('name')));
  const all  = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  const withCode = all.filter(p => (p.barcode || '').trim());
  const noCode   = all.filter(p => !(p.barcode || '').trim());
  const inactive = all.filter(p => p.active === false);

  document.getElementById('s-total').textContent = all.length;
  document.getElementById('s-com').textContent   = withCode.length;
  document.getElementById('s-sem').textContent   = noCode.length;
  document.getElementById('s-inat').textContent  = inactive.length;

  const row = (p, useBarcodeCol) => {
    const ativo = p.active === false
      ? '<span class="tag inativo">INATIVO</span>'
      : '<span class="tag">Ativo</span>';
    const col = useBarcodeCol
      ? `<td>${esc(p.barcode)}</td>`
      : `<td style="font-size:.7rem;color:#666">${esc(p.id)}</td>`;
    return `<tr>
      <td>${esc(p.name)}</td>
      <td>${esc(p.brand||'—')}</td>
      <td><span class="tag cat">${esc(p.category||'—')}</span></td>
      ${col}
      <td>${brl(p.price)}</td>
      <td>${p.stock ?? 0}</td>
      <td>${ativo}</td>
    </tr>`;
  };

  document.querySelector('#t-com tbody').innerHTML = withCode.map(p => row(p, true)).join('') || '<tr><td colspan="7" style="color:#888">Nenhum</td></tr>';
  document.querySelector('#t-sem tbody').innerHTML = noCode.map(p => row(p, false)).join('') || '<tr><td colspan="7" style="color:#888">Nenhum</td></tr>';

  document.getElementById('status').style.display  = 'none';
  document.getElementById('output').style.display  = '';
} catch (e) {
  document.getElementById('status').style.display  = 'none';
  document.getElementById('error').style.display   = '';
  document.getElementById('error').textContent      = '❌ Erro: ' + e.message;
}
</script>
</body>
</html>
