<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setup Operadores — Empório GO</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse at 60% 0%, #1a2f50 0%, #0d1b2a 60%);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: #152233;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%; max-width: 460px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }
    h1 { font-size: 22px; font-weight: 800; color: #e8c44a; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #6688aa; margin-bottom: 28px; }
    .ops-preview {
      display: flex; gap: 14px; margin-bottom: 28px;
    }
    .op-chip {
      flex: 1; background: #0d1b2a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 16px;
      text-align: center;
    }
    .op-chip .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, #1e3661, #0f1f3a);
      border: 2px solid #e8c44a;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800; color: #e8c44a;
      margin: 0 auto 10px;
    }
    .op-chip .op-name { font-size: 15px; font-weight: 700; }
    .op-chip .op-pin { font-size: 11px; color: #6688aa; margin-top: 4px; letter-spacing: 1px; }
    .section-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: #e8c44a; margin-bottom: 14px;
      padding-bottom: 8px; border-bottom: 1px solid rgba(232,196,74,0.2);
    }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #6688aa; letter-spacing: .6px; margin-bottom: 6px; }
    .field input {
      width: 100%; background: #0d1b2a;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px; padding: 11px 14px;
      color: #fff; font-size: 14px; outline: none;
      transition: border-color .15s;
    }
    .field input:focus { border-color: #e8c44a; }
    .btn {
      width: 100%; padding: 15px;
      background: #e8c44a; color: #0d1b2a;
      border: none; border-radius: 10px;
      font-size: 16px; font-weight: 800;
      cursor: pointer; transition: background .15s;
      margin-top: 8px;
    }
    .btn:hover:not(:disabled) { background: #f5d45a; }
    .btn:disabled { opacity: .5; cursor: default; }
    .log {
      margin-top: 18px; background: #0a1520;
      border-radius: 10px; padding: 14px;
      font-size: 13px; line-height: 1.8;
      display: none;
    }
    .log.visible { display: block; }
    .ok   { color: #4dcc88; }
    .err  { color: #ff7070; }
    .info { color: #8899bb; }
    .divider { height: 1px; background: rgba(255,255,255,0.07); margin: 20px 0; }
    #step-ops { display: none; }
    .admin-badge {
      display: flex; align-items: center; gap: 8px;
      background: rgba(77,204,136,0.1); border: 1px solid rgba(77,204,136,0.3);
      border-radius: 10px; padding: 10px 14px; margin-bottom: 24px;
      font-size: 13px; color: #4dcc88;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>Setup Operadores</h1>
  <div class="sub">Cria as contas de Rafael e Neto no quiosque. Use uma vez.</div>

  <!-- Preview dos operadores -->
  <div class="ops-preview">
    <div class="op-chip">
      <div class="avatar">R</div>
      <div class="op-name">Rafael</div>
      <div class="op-pin">PIN: 102030</div>
    </div>
    <div class="op-chip">
      <div class="avatar">N</div>
      <div class="op-name">Neto</div>
      <div class="op-pin">PIN: 102030</div>
    </div>
  </div>

  <!-- Step 1: admin login -->
  <div id="step-admin">
    <div class="section-title">Login de administrador</div>
    <div class="field">
      <label>E-mail</label>
      <input id="a-email" type="email" placeholder="admin@email.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Senha</label>
      <input id="a-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="btn-login">Entrar e criar operadores</button>
    <div class="log" id="log-admin"></div>
  </div>

  <!-- Step 2: create -->
  <div id="step-ops">
    <div class="admin-badge" id="admin-badge">✓ Logado</div>
    <button class="btn" id="btn-create">Criar Rafael e Neto agora</button>
    <div class="log" id="log-ops"></div>
  </div>
</div>

<script type="module">
  import { initializeApp }
    from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword }
    from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
  import { getFirestore, collection, query, where, getDocs, setDoc, addDoc, doc, serverTimestamp }
    from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';
  import { firebaseConfig } from './scripts/firebase-config.js';

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  const KEY  = firebaseConfig.apiKey;

  const OPERATORS = [
    { name: 'Rafael', email: 'rafael@emporiogo.com', pin: '102030', role: 'Vendedor', order: 0 },
    { name: 'Neto',   email: 'neto@emporiogo.com',   pin: '102030', role: 'Vendedor', order: 1 },
  ];

  function log(id, msg, type = 'info') {
    const el = document.getElementById(id);
    el.classList.add('visible');
    el.innerHTML += `<div class="${type}">${msg}</div>`;
  }

  async function createAuthUser(email, pin, name) {
    const res = await fetch(
      `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${KEY}`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pin, displayName: name, returnSecureToken: true }) }
    );
    const data = await res.json();
    if (data.error) {
      if (data.error.message === 'EMAIL_EXISTS') {
        // Update password via sign-in + update
        const r2 = await fetch(
          `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${KEY}`,
          { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password: pin, returnSecureToken: true }) }
        );
        const d2 = await r2.json();
        if (d2.localId) return d2.localId;
        // Password may have changed — get UID from Firestore if possible
        throw new Error(`Conta já existe mas o PIN não bate. Redefina a senha pelo painel.`);
      }
      throw new Error(data.error.message);
    }
    return data.localId;
  }

  async function createOperator(op, logId) {
    log(logId, `Criando conta para <strong>${op.name}</strong>…`);
    const uid = await createAuthUser(op.email, op.pin, op.name);
    log(logId, `✓ Auth OK — UID ${uid.slice(0,8)}…`, 'ok');

    await setDoc(doc(db, 'users', uid), {
      name: op.name, email: op.email, role: op.role.toLowerCase(),
      createdAt: serverTimestamp(),
    }, { merge: true });
    log(logId, `✓ Usuário salvo`, 'ok');

    const snap = await getDocs(
      query(collection(db, 'settings'), where('_type', '==', 'kiosk_op'), where('email', '==', op.email))
    );
    const data = { _type: 'kiosk_op', name: op.name, email: op.email, uid, role: op.role, active: true, order: op.order };
    if (!snap.empty) {
      await setDoc(snap.docs[0].ref, data, { merge: true });
    } else {
      await addDoc(collection(db, 'settings'), { ...data, createdAt: serverTimestamp() });
    }
    log(logId, `✓ Operador registrado no quiosque!`, 'ok');
  }

  // Login
  async function doLogin() {
    const email = document.getElementById('a-email').value.trim();
    const pass  = document.getElementById('a-pass').value;
    const btn   = document.getElementById('btn-login');
    if (!email || !pass) { log('log-admin', 'Preencha e-mail e senha.', 'err'); return; }
    btn.disabled = true; btn.textContent = 'Entrando…';
    document.getElementById('log-admin').innerHTML = '';
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      document.getElementById('step-admin').style.display = 'none';
      document.getElementById('step-ops').style.display = 'block';
      document.getElementById('admin-badge').textContent = `✓ Logado como ${email}`;
    } catch {
      log('log-admin', 'E-mail ou senha incorretos.', 'err');
      btn.disabled = false; btn.textContent = 'Entrar e criar operadores';
    }
  }

  document.getElementById('btn-login').onclick = doLogin;
  document.getElementById('a-pass').onkeydown = e => { if (e.key === 'Enter') doLogin(); };

  // Create operators
  document.getElementById('btn-create').onclick = async () => {
    const btn = document.getElementById('btn-create');
    btn.disabled = true; btn.textContent = 'Criando…';
    document.getElementById('log-ops').innerHTML = '';

    let ok = 0;
    for (const op of OPERATORS) {
      try {
        await createOperator(op, 'log-ops');
        ok++;
      } catch (err) {
        log('log-ops', `✗ Erro em ${op.name}: ${err.message}`, 'err');
      }
      log('log-ops', '─────────');
    }

    if (ok === OPERATORS.length) {
      log('log-ops', `Tudo certo! Rafael e Neto podem usar o quiosque com PIN <strong>102030</strong>.`, 'ok');
      btn.textContent = 'Concluído ✓';
    } else {
      btn.disabled = false; btn.textContent = 'Tentar novamente';
    }
  };
</script>
</body>
</html>
