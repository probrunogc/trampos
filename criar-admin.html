<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Admin — Empório das Bebidas</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e8e0d0;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
    }
    h1 { font-size: 1.25rem; margin-bottom: 6px; color: #d4a843; }
    p.sub { font-size: 0.85rem; color: #888; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 14px;
      background: #111; border: 1px solid #333;
      border-radius: 8px; color: #e8e0d0;
      font-size: 0.95rem; outline: none;
    }
    input:focus { border-color: #d4a843; }
    .divider { border: none; border-top: 1px solid #2a2a2a; margin: 24px 0; }
    button {
      width: 100%; padding: 12px;
      background: #d4a843; color: #0f0f0f;
      border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      margin-top: 16px; padding: 12px 14px;
      border-radius: 8px; font-size: 0.9rem;
      display: none;
    }
    .msg.ok  { background: #1a3a1a; border: 1px solid #2d6a2d; color: #6fcf6f; display: block; }
    .msg.err { background: #3a1a1a; border: 1px solid #6a2d2d; color: #cf6f6f; display: block; }
    .info { background: #1a2a3a; border: 1px solid #2d4a6a; color: #7ab3d4; border-radius: 8px; padding: 12px 14px; font-size: 0.82rem; margin-bottom: 20px; }
    .section-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .08em; color: #666; margin-bottom: 14px; }
  </style>
</head>
<body>
<div class="card">
  <h1>Criar Admin — Empório</h1>
  <p class="sub">Página de uso único para cadastrar um administrador.</p>

  <div class="info">
    Preencha os dados do <strong>admin existente</strong> (quem já tem acesso),
    depois os dados do <strong>Raphael</strong>. O sistema cria a conta e já pode logar.
  </div>

  <div class="section-title">Admin existente (para autorizar)</div>
  <div class="field">
    <label>E-mail do admin atual</label>
    <input id="cur-email" type="email" placeholder="admin@emporio.com" />
  </div>
  <div class="field">
    <label>Senha do admin atual</label>
    <input id="cur-pass" type="password" placeholder="••••••" />
  </div>

  <hr class="divider">

  <div class="section-title">Nova conta — Raphael</div>
  <div class="field">
    <label>Nome completo</label>
    <input id="new-name" type="text" value="Raphael" />
  </div>
  <div class="field">
    <label>E-mail</label>
    <input id="new-email" type="email" placeholder="raphael@emporio.com" />
  </div>
  <div class="field">
    <label>Senha (mín. 6 caracteres)</label>
    <input id="new-pass" type="password" placeholder="••••••" />
  </div>

  <button id="btn" onclick="criar()">Criar conta admin</button>
  <div id="msg" class="msg"></div>
</div>

<script type="module">
  import { initializeApp, getApp, getApps } from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js';
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    signOut
  } from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js';
  import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
  } from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js';

  const config = {
    apiKey:            "AIzaSyCT3BGvNWRzoOc3mT4lDRRfz6GISptkUzc",
    authDomain:        "adegas-pf.firebaseapp.com",
    projectId:         "adegas-pf",
    storageBucket:     "adegas-pf.firebasestorage.app",
    messagingSenderId: "688042256969",
    appId:             "1:688042256969:web:110f697c3db4ee7b57ed98"
  };

  // App principal
  const appMain = getApps().length ? getApp() : initializeApp(config, 'main');
  // App secundário — para criar o usuário sem afetar a sessão do admin
  const appSec  = initializeApp(config, 'secondary');

  const authMain = getAuth(appMain);
  const authSec  = getAuth(appSec);
  const db       = getFirestore(appMain);

  window.criar = async function () {
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    msg.className = 'msg';
    msg.textContent = '';

    const curEmail = document.getElementById('cur-email').value.trim();
    const curPass  = document.getElementById('cur-pass').value;
    const newName  = document.getElementById('new-name').value.trim();
    const newEmail = document.getElementById('new-email').value.trim().toLowerCase();
    const newPass  = document.getElementById('new-pass').value;

    if (!curEmail || !curPass || !newName || !newEmail || !newPass) {
      msg.className = 'msg err';
      msg.textContent = 'Preencha todos os campos.';
      return;
    }
    if (newPass.length < 6) {
      msg.className = 'msg err';
      msg.textContent = 'A senha do Raphael precisa ter pelo menos 6 caracteres.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Aguarde…';

    try {
      // 1. Loga como admin principal
      await signInWithEmailAndPassword(authMain, curEmail, curPass);

      // 2. Cria o usuário do Raphael no app secundário (não afeta sessão do admin)
      const secCred = await createUserWithEmailAndPassword(authSec, newEmail, newPass);
      const uid = secCred.user.uid;

      // 3. Escreve o perfil no Firestore como admin (sessão do authMain)
      await setDoc(doc(db, 'users', uid), {
        name:      newName,
        email:     newEmail,
        role:      'admin',
        active:    true,
        createdAt: Date.now(),
        updatedAt: Date.now()
      });

      // 4. Encerra sessão do app secundário
      await signOut(authSec);
      await signOut(authMain);

      msg.className = 'msg ok';
      msg.innerHTML = `
        ✅ Conta criada com sucesso!<br><br>
        <strong>E-mail:</strong> ${newEmail}<br>
        <strong>Senha:</strong> ${newPass}<br>
        <strong>Perfil:</strong> Administrador<br><br>
        Agora acesse <a href="/" style="color:#6fcf6f">adegas-pf.web.app</a> e faça login.
      `;
      btn.textContent = 'Conta criada ✓';

    } catch (err) {
      msg.className = 'msg err';
      const erros = {
        'auth/invalid-credential':    'E-mail ou senha do admin atual incorretos.',
        'auth/user-not-found':        'Admin atual não encontrado.',
        'auth/wrong-password':        'Senha do admin atual incorreta.',
        'auth/email-already-in-use':  'Esse e-mail já está cadastrado no sistema.',
        'auth/weak-password':         'Senha fraca — use pelo menos 6 caracteres.',
        'auth/invalid-email':         'E-mail inválido.'
      };
      msg.textContent = erros[err.code] || err.message;
      btn.disabled = false;
      btn.textContent = 'Criar conta admin';
    }
  };
</script>
</body>
</html>
