<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Empório das Bebidas">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#FBEAA7"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="65%" stop-color="#A8861C"/>
      <stop offset="100%" stop-color="#F4D77A"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBEAA7"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#7E6213"/>
    </linearGradient>
    <radialGradient id="darkCore" cx="50%" cy="40%" r="60%">
      <stop offset="0%"  stop-color="#16294A"/>
      <stop offset="100%" stop-color="#050B17"/>
    </radialGradient>
    <linearGradient id="beer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F4B942"/>
    </linearGradient>
  </defs>

  <!-- Outer scalloped medallion -->
  <g>
    <circle cx="100" cy="100" r="94" fill="url(#goldRim)"/>
    <circle cx="100" cy="100" r="84" fill="url(#darkCore)"/>
    <circle cx="100" cy="100" r="84" fill="none" stroke="url(#gold)" stroke-width="2.5"/>

    <!-- Decorative dots around the rim -->
    <g fill="#FBEAA7">
      <circle cx="100" cy="14" r="1.8"/>
      <circle cx="160" cy="40" r="1.8"/>
      <circle cx="186" cy="100" r="1.8"/>
      <circle cx="160" cy="160" r="1.8"/>
      <circle cx="100" cy="186" r="1.8"/>
      <circle cx="40"  cy="160" r="1.8"/>
      <circle cx="14"  cy="100" r="1.8"/>
      <circle cx="40"  cy="40"  r="1.8"/>
    </g>

    <!-- Beer mugs -->
    <g>
      <!-- Left mug -->
      <g transform="translate(35,70)">
        <rect x="0" y="8" width="22" height="34" rx="3" fill="url(#beer)" stroke="#7E6213" stroke-width="1.2"/>
        <rect x="0" y="0" width="22" height="10" rx="3" fill="#FFF6D1" stroke="#7E6213" stroke-width="1.2"/>
        <circle cx="6" cy="3" r="3" fill="#FFF6D1" stroke="#7E6213" stroke-width="1.2"/>
        <circle cx="16" cy="2" r="3.5" fill="#FFF6D1" stroke="#7E6213" stroke-width="1.2"/>
        <path d="M22 14 Q30 14 30 24 Q30 34 22 34" fill="none" stroke="#7E6213" stroke-width="2"/>
      </g>
      <!-- Right mug -->
      <g transform="translate(143,70) scale(-1,1)">
        <rect x="0" y="8" width="22" height="34" rx="3" fill="url(#beer)" stroke="#7E6213" stroke-width="1.2"/>
        <rect x="0" y="0" width="22" height="10" rx="3" fill="#FFF6D1" stroke="#7E6213" stroke-width="1.2"/>
        <circle cx="6" cy="3" r="3" fill="#FFF6D1" stroke="#7E6213" stroke-width="1.2"/>
        <circle cx="16" cy="2" r="3.5" fill="#FFF6D1" stroke="#7E6213" stroke-width="1.2"/>
        <path d="M22 14 Q30 14 30 24 Q30 34 22 34" fill="none" stroke="#7E6213" stroke-width="2"/>
      </g>
    </g>

    <!-- Brand text -->
    <g text-anchor="middle">
      <text x="100" y="130" font-family="Cinzel, serif" font-weight="900" font-size="22" fill="url(#gold)" letter-spacing="2">EMPÓRIO</text>
      <text x="100" y="150" font-family="Dancing Script, cursive" font-weight="700" font-size="16" fill="#F8F4E6">das Bebidas</text>
      <text x="100" y="170" font-family="Cinzel, serif" font-weight="700" font-size="7" fill="#D4AF37" letter-spacing="3">★ SINCE 2025 ★</text>
    </g>
  </g>
</svg>
