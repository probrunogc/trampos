<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seed Produtos — Empório GO</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f0f0f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #e8e0d0; padding: 24px; }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 32px; width: 100%; max-width: 480px; }
    h1 { font-size: 1.2rem; margin-bottom: 6px; color: #d4a843; }
    p.sub { font-size: 0.82rem; color: #888; margin-bottom: 24px; line-height: 1.5; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 0.78rem; color: #aaa; margin-bottom: 5px; }
    input { width: 100%; padding: 10px 14px; background: #111; border: 1px solid #333;
      border-radius: 8px; color: #e8e0d0; font-size: 0.9rem; outline: none; }
    input:focus { border-color: #d4a843; }
    button { width: 100%; padding: 12px; background: #d4a843; color: #0f0f0f;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 0.85rem; display: none; }
    .msg.ok  { background: #1a3a1a; border: 1px solid #2d6a2d; color: #6fcf6f; display: block; }
    .msg.err { background: #3a1a1a; border: 1px solid #6a2d2d; color: #cf6f6f; display: block; }
    .log { margin-top: 16px; background: #111; border: 1px solid #2a2a2a; border-radius: 8px;
      padding: 12px; max-height: 260px; overflow-y: auto; font-size: 0.78rem; color: #888; display: none; }
    .log p { margin-bottom: 4px; }
    .log p.ok { color: #6fcf6f; }
    .log p.err { color: #cf6f6f; }
  </style>
</head>
<body>
<div class="card">
  <h1>Seed de Produtos — Empório GO</h1>
  <p class="sub">Página de uso único. Informe o e-mail e senha do admin para cadastrar os 20 produtos no Firestore.</p>
  <div class="field">
    <label>E-mail do admin</label>
    <input id="email" type="email" placeholder="admin@emporio.com" />
  </div>
  <div class="field">
    <label>Senha</label>
    <input id="pass" type="password" placeholder="••••••" />
  </div>
  <button id="btn" onclick="run()">Cadastrar 20 produtos</button>
  <div id="msg" class="msg"></div>
  <div id="log" class="log"></div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';

const config = {
  apiKey: "AIzaSyCT3BGvNWRzoOc3mT4lDRRfz6GISptkUzc",
  authDomain: "adegas-pf.firebaseapp.com",
  projectId: "adegas-pf",
  storageBucket: "adegas-pf.firebasestorage.app",
  messagingSenderId: "688042256969",
  appId: "1:688042256969:web:110f697c3db4ee7b57ed98"
};

const app  = getApps().length ? getApp() : initializeApp(config);
const auth = getAuth(app);
const db   = getFirestore(app);

const PRODUTOS = [
  { name: 'Corona Extra 350ml',           brand: 'Corona',         category: 'Cerveja',    unit: 'un', price: 12.00, stock: 24, image: '/assets/produtos/cerveja/corona-extra-350ml.png' },
  { name: 'Brahma Chopp Garrafa 355ml',   brand: 'Brahma',         category: 'Cerveja',    unit: 'un', price: 6.50,  stock: 48, image: '/assets/produtos/cerveja/brahma-garrafa-355ml.png' },
  { name: 'Antarctica Pilsen Lata 350ml', brand: 'Antarctica',     category: 'Cerveja',    unit: 'un', price: 5.00,  stock: 48, image: '/assets/produtos/cerveja/antarctica-pilsen-lata-350ml.png' },
  { name: 'Heineken Lata 350ml',          brand: 'Heineken',       category: 'Cerveja',    unit: 'un', price: 8.50,  stock: 48, image: '/assets/produtos/cerveja/heineken-lata-350ml.png' },
  { name: 'Brahma Chopp Lata 350ml',      brand: 'Brahma',         category: 'Cerveja',    unit: 'un', price: 5.50,  stock: 48, image: '/assets/produtos/cerveja/brahma-lata-350ml.png' },
  { name: 'Skol Garrafa 355ml',           brand: 'Skol',           category: 'Cerveja',    unit: 'un', price: 6.00,  stock: 48, image: '/assets/produtos/cerveja/skol-garrafa-355ml.png' },
  { name: 'Heineken Garrafa 330ml',       brand: 'Heineken',       category: 'Cerveja',    unit: 'un', price: 9.00,  stock: 24, image: '/assets/produtos/cerveja/heineken-garrafa-330ml.png' },
  { name: 'Skol Lata 350ml',             brand: 'Skol',           category: 'Cerveja',    unit: 'un', price: 5.00,  stock: 48, image: '/assets/produtos/cerveja/skol-lata-350ml.png' },
  { name: "Jack Daniel's 1,5L",           brand: "Jack Daniel's",  category: 'Destilado',  unit: 'un', price: 320.00,stock: 6,  image: '/assets/produtos/destilado/jack-daniels-1500ml.png' },
  { name: "Ballantine's Finest 1L",       brand: "Ballantine's",   category: 'Destilado',  unit: 'un', price: 145.00,stock: 6,  image: '/assets/produtos/destilado/ballantines-1000ml.png' },
  { name: 'Ypioca Ouro Cachaça 1L',       brand: 'Ypioca',         category: 'Destilado',  unit: 'un', price: 45.00, stock: 12, image: '/assets/produtos/destilado/ypioca-ouro-1000ml.png' },
  { name: 'Smirnoff Vodka 1L',            brand: 'Smirnoff',       category: 'Destilado',  unit: 'un', price: 75.00, stock: 12, image: '/assets/produtos/destilado/smirnoff-1000ml.png' },
  { name: "Jack Daniel's 1L",             brand: "Jack Daniel's",  category: 'Destilado',  unit: 'un', price: 210.00,stock: 6,  image: '/assets/produtos/destilado/jack-daniels-1000ml.png' },
  { name: 'Johnnie Walker Red Label 750ml',brand: 'Johnnie Walker', category: 'Destilado',  unit: 'un', price: 120.00,stock: 6,  image: '/assets/produtos/destilado/johnnie-walker-red-750ml.png' },
  { name: 'Monster Energy 473ml',         brand: 'Monster',        category: 'Energético', unit: 'un', price: 14.00, stock: 24, image: '/assets/produtos/energetico/monster-energy-473ml.png' },
  { name: 'Baly Energy Drink 2L',         brand: 'Baly',           category: 'Energético', unit: 'un', price: 22.00, stock: 12, image: '/assets/produtos/energetico/baly-energy-2000ml.png' },
  { name: 'Baly Citrus 473ml',            brand: 'Baly',           category: 'Energético', unit: 'un', price: 8.00,  stock: 24, image: '/assets/produtos/energetico/baly-citrus-473ml.png' },
  { name: 'Monster Zero Ultra 473ml',     brand: 'Monster',        category: 'Energético', unit: 'un', price: 15.00, stock: 24, image: '/assets/produtos/energetico/monster-zero-ultra-473ml.png' },
  { name: 'Pérgola Tinto Suave 1L',       brand: 'Pérgola',        category: 'Vinho',      unit: 'un', price: 28.00, stock: 12, image: '/assets/produtos/vinho/pergola-tinto-suave-1000ml.png' },
  { name: 'Gaioto Tinto 750ml',           brand: 'Gaioto',         category: 'Vinho',      unit: 'un', price: 32.00, stock: 12, image: '/assets/produtos/vinho/gaioto-tinto-750ml.png' },
];

window.run = async function() {
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  const log = document.getElementById('log');
  msg.className = 'msg'; msg.textContent = '';
  log.style.display = 'none'; log.innerHTML = '';

  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('pass').value;
  if (!email || !pass) { msg.className = 'msg err'; msg.textContent = 'Preencha e-mail e senha.'; return; }

  btn.disabled = true; btn.textContent = 'Aguarde…';

  function addLog(text, type = '') {
    log.style.display = 'block';
    const p = document.createElement('p');
    p.className = type; p.textContent = text;
    log.appendChild(p); log.scrollTop = log.scrollHeight;
  }

  try {
    addLog('Autenticando...');
    await signInWithEmailAndPassword(auth, email, pass);
    addLog('Autenticado. Cadastrando produtos...', 'ok');

    let ok = 0, fail = 0;
    for (const p of PRODUTOS) {
      try {
        await addDoc(collection(db, 'products'), {
          ...p,
          active: true,
          minStock: 6,
          costPrice: 0,
          createdAt: Date.now(),
          updatedAt: Date.now()
        });
        addLog(`✓ ${p.name}`, 'ok');
        ok++;
      } catch (e) {
        addLog(`✗ ${p.name}: ${e.message}`, 'err');
        fail++;
      }
    }

    msg.className = 'msg ok';
    msg.innerHTML = `${ok} produto(s) cadastrado(s) com sucesso${fail ? ` — ${fail} erro(s)` : ''}.<br>Acesse o painel para ajustar preços e estoque.`;
    btn.textContent = 'Concluído ✓';
  } catch (e) {
    const erros = { 'auth/invalid-credential': 'E-mail ou senha incorretos.', 'auth/wrong-password': 'Senha incorreta.' };
    msg.className = 'msg err'; msg.textContent = erros[e.code] || e.message;
    btn.disabled = false; btn.textContent = 'Tentar novamente';
  }
};
</script>
</body>
</html>
