<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atualizar Produtos — Empório GO</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f0f0f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #e8e0d0; padding: 24px; }

    p.sub { font-size: 0.82rem; color: #888; margin-bottom: 24px; line-height: 1.5; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 0.78rem; color: #aaa; margin-bottom: 5px; }
    input { width: 100%; padding: 10px 14px; background: #111; border: 1px solid #333;
      border-radius: 8px; color: #e8e0d0; font-size: 0.9rem; outline: none; }
    input:focus { border-color: #d4a843; }
    button { width: 100%; padding: 12px; background: #d4a843; color: #0f0f0f;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .log { margin-top: 16px; background: #111; border: 1px solid #2a2a2a; border-radius: 8px;
      padding: 12px; max-height: 320px; overflow-y: auto; font-size: 0.78rem; color: #888; display: none; }
    .log p { margin-bottom: 4px; }
    .log p.ok { color: #6fcf6f; }
    .log p.skip { color: #aaa; }
    .log p.err { color: #cf6f6f; }
  </style>
</head>
<body>
<div class="card">
  <h1>Atualizar descrições dos produtos</h1>
  <p class="sub">Busca todos os produtos no Firestore e preenche descrição, teor alcoólico e origem para os que ainda não têm. Informe o e-mail e senha do admin.</p>
  <div class="field"><label>E-mail do admin</label><input id="email" type="email" placeholder="admin@emporio.com" /></div>
  <div class="field"><label>Senha</label><input id="pass" type="password" placeholder="••••••••" /></div>
  <button id="btn">Atualizar produtos</button>
  <div class="log" id="log"></div>
</div>

import { firebaseConfig } from './scripts/firebase-config.js';

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

    teor: '—', origem: 'Brasil' },

function lookup(name, brand) {
  const text = `${name || ''} ${brand || ''}`;
  for (const entry of INFO) {
    if (entry.match.test(text)) return entry;
  }
  return null;
}

document.getElementById('btn').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('pass').value;
  const log   = document.getElementById('log');
  const btn   = document.getElementById('btn');

  log.style.display = 'block';
  log.innerHTML = '';
  btn.disabled = true;

  const addLog = (msg, cls = '') => {
    const p = document.createElement('p');
    if (cls) p.className = cls;
    p.textContent = msg;
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
  };

  try {
    addLog('Autenticando…');
    await signInWithEmailAndPassword(auth, email, pass);
    addLog('Autenticado!', 'ok');

    addLog('Buscando produtos…');
    const snap = await getDocs(collection(db, 'products'));
    addLog(`${snap.size} produto(s) encontrado(s).`);

    let updated = 0, skipped = 0;
    for (const docSnap of snap.docs) {
      const p = docSnap.data();
      const info = lookup(p.name, p.brand);
      if (!info) {
        addLog(`⚠ Sem dados para: ${p.name}`, 'skip');
        skipped++;
        continue;
      }
      const patch = {};
      if (!p.description) patch.description = info.description;
      if (!p.teor)        patch.teor        = info.teor;
      if (!p.origem)      patch.origem      = info.origem;
      if (Object.keys(patch).length === 0) {
        addLog(`↷ Já preenchido: ${p.name}`, 'skip');
        skipped++;
        continue;
      }
      await updateDoc(doc(db, 'products', docSnap.id), patch);
      addLog(`✔ Atualizado: ${p.name}`, 'ok');
      updated++;
    }
    addLog(`\nPronto! ${updated} atualizado(s), ${skipped} ignorado(s).`, 'ok');
  } catch (err) {
    addLog(`Erro: ${err.message}`, 'err');
  }
  btn.disabled = false;
};
</script>
